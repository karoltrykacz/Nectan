[package]
name = "nectan-vault"
version = "0.1.0"
edition = "2024"
authors = ["karoltrykacz"]

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = [ "rayon", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
ignore = { version = "0.4.33", features = ["simd-accel"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zstd = "0.14.0"
