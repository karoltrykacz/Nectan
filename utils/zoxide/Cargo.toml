[package]
name = "zoxide"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.32"
askama = { version = "0.16.0", default-features = false, features = [
    "derive",
    "std",
] }
bincode = "1.3.1"
dirs = "6.0.0"
dunce = "1.0.1"
fastrand = "2.0.0"
glob = "0.3.0"
ouroboros = "0.18.3"
serde = { version = "1.0.116", features = ["derive"] }
tempfile = "3.27.0"
time = { version = "0.3.47", default-features = false, features = ["parsing", "macros", "std"] }
