[package]
name = "nectan_core"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
ignore = "0.4.33"
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["macros"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
dirs = "7.0.0"

iroh = "1.1.0"
postcard = { version = "1.1.3", features = ["alloc"] }
iroh-mdns-address-lookup = "0.5.0"
rand = "0.10.2"
base64 = "0.23.1"
bytes = "1.12.1"
reqwest = "0.13.5"
tokio-util = "0.7.19"
fixedbitset = "0.5.7"
redb = "4.3.0"
n0-error = { version = "1.0.1", features = ["anyhow"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }

[features]
transfers = []
