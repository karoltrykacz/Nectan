[package]
name = "transfers"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[dependencies]
nectan_core = {path = "../core"}
anyhow = "1.0.104"
tracing = "0.1.44"
iroh = "1.1.0"
serde = "1.0.229"
postcard = { version = "1.1.3", features = ["alloc"] }
iroh-mdns-address-lookup = "0.5.0"
rand = "0.10.2"
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["macros"] }
bytes = "1.12.1"
reqwest = "0.13.5"
tokio-util = "0.7.19"
fixedbitset = "0.5.7"
redb = "4.3.0"
n0-error = { version = "1.0.1", features = ["anyhow"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
