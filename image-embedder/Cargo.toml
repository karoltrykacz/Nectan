[package]
name = "nectan-image-embedder"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true
default-run = "nectan-image-embedder"

[dependencies]
anyhow = "1.0.104"
face_id = "0.6.0"
image = "0.25.10"
indicatif = "0.18.6"
iroh = "1.5.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.15"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.5.2"

[[bin]]
name = "client"
path = "src/client.rs"
