[package]
name = "nectan_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["rayon", "serde"] }
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
iroh = "1.4.1"
postcard = "1.1.3"
rand = "0.10.4"
redb = "4.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlite = "0.37.4"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.20"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4"] }
