<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" type="image/x-icon" href="../icon.ico">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nectan</title>
	<meta name="description"
		content="Download Nectan to send and receive transfers from friends. Available for Windows, Linux and Android devices.">

	<style>
		.download_container {
			min-height: 100vh;
			display: flex;
			align-items: center;
			flex-direction: column;
			padding-bottom: 60px;
		}

		.details {
			color: var(--svg_icon_col);
			font-size: 13px;
			font-weight: 400;
		}

		.section_title {
			font-family: "Rubik";
			font-size: 24px;
			font-weight: 600;
			margin-top: 56px;
			margin-bottom: 24px;
			opacity: 0.9;
		}

		.platform_grid {
			display: flex;
			justify-content: center;
			gap: 20px;
			width: 100%;
			max-width: 800px;
			flex-wrap: wrap;
			padding: 0 20px;
		}

		.desktop_list_container {
			width: 100%;
			max-width: 800px;
			border: var(--classic-border);
			border-radius: 16px;
			padding: 12px 24px;
			box-sizing: border-box;
		}

		.desktop_row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 20px 0;
			flex-wrap: wrap;
			gap: 16px;
		}

		.desktop_row:not(:last-child) {
			border-bottom: 1px solid rgba(255, 255, 255, 0.105);
		}

		.desktop_platform_name {
			font-family: "Rubik";
			font-size: 18px;
			font-weight: 500;
			min-width: 120px;
		}

		.desktop_links_inline {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			flex: 1;
			justify-content: flex-end;
		}

		.desktop_links_inline a {
			color: black;
			font-size: 14px;
			text-decoration: none;
			border: 1px solid rgba(255, 255, 255, 0.105);
			background-color: #f1f1f1;
			padding: 8px 16px;
			border-radius: 8px;
			font-weight: 500;
			transition: background 0.2s ease;
			white-space: nowrap;
		}

		.desktop_links_inline a:hover {
			background: #cfcfcf;
		}

		.platform_card {
			flex: 1;
			max-width: 300px;
			border: var(--classic-border);
			border-radius: 16px;
			padding: 24px;
			display: flex;
			flex-direction: column;
			align-items: center;
			box-sizing: border-box;
		}

		.platform_name {
			font-family: "Rubik";
			font-size: 20px;
			font-weight: 500;
			margin-bottom: 16px;
		}

		.qr_wrapper {
			background: #ffffff;
			padding: 4px;
			border-radius: 12px;
			margin-bottom: 16px;
			display: inline-block;
		}

		.qr_code {
			width: 196px;
			height: 196px;
			display: block;
		}

		.store_link {
			font-size: 14px;
			color: inherit;
			text-decoration: none;
			opacity: 0.7;
			border-bottom: 1px solid currentColor;
			padding-bottom: 2px;
		}

		.store_link:hover {
			opacity: 1;
		}
	</style>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="../index.css">
	<script src="../i18n.js" defer></script>
</head>

<body>
	<div class="main_container">

		<div class="header">
			<a href="/" style="text-decoration: none; color: inherit; height: 100%;">
				<div class="logo" style="font-size: 24px; font-weight: 600; font-family: 'Rubik';">
					Nectan</div>
			</a>
			<div class="tabs">
				<a data-i18n="website.pricing" class="tab clicky" style="text-decoration: none;"
					href="/pricing">Pricing</a>
				<a data-i18n="website.download_generic" class="tab clicky"
					style="text-decoration: none;" href="/download">Download Nectan</a>
				<a data-i18n="website.github" class="tab clicky" style="text-decoration: none;"
					href="https://github.com/karoltrykacz/Nectan">GitHub</a>

				<button id="theme-toggle" aria-label="Toggle theme">
					<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="5"></circle>
						<line x1="12" y1="1" x2="12" y2="3"></line>
						<line x1="12" y1="21" x2="12" y2="23"></line>
						<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
						<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
						<line x1="1" y1="12" x2="3" y2="12"></line>
						<line x1="21" y1="12" x2="23" y2="12"></line>
						<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
						<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
					</svg>
					<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
					</svg>
				</button>
			</div>
			<button class="hamburger">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</div>

		<div class="download_container">
			<div data-i18n="website.download_generic"
				style="font-family: 'Rubik'; font-size: 48px; font-weight: 600; margin-top: 200px;">
				Download Nectan
			</div>
			<div class=" download_wrapper">
				<a class="download_button" style="text-decoration: none; margin: 0; margin-top: 64px;"
					href="/download">Download for linux (AppImage)</a>
			</div>
			<div class="details" style="margin-top: 24px;">Last updated 20 August</div>
			<div class="section_title" style="margin-top: 200px;">Other Platforms</div>
			<div class="desktop_list_container">
				<div class="desktop_row">
					<div class="desktop_platform_name">Windows</div>
					<div class="desktop_links_inline">
						<a href="/download/Nectan-installer.exe">Download</a>
					</div>
				</div>
				<div class="desktop_row">
					<div class="desktop_platform_name">Linux</div>
					<div class="desktop_links_inline">
						<a href="/download/linux-appimage">AppImage</a>
						<a href="/download/linux-snap">Snap Store</a>
						<a href="/download/linux-deb">.deb package</a>
					</div>
				</div>

			</div>

			<div class="section_title" style="margin-top: 128px;">Take Nectan on the go</div>
			<div class=" platform_grid" style="margin-bottom: 128px;">
				<div class="platform_card">
					<div class="platform_name">Google Play</div>
					<div class="qr_wrapper">
						<img class="qr_code" src="/qr-play-google-com.svg"
							alt="Android QR Code">
					</div>
				</div>

				<!-- <div class="platform_card">
                    <div class="platform_name">App store</div>
                    <div class="qr_wrapper">
                        <img class="qr_code" src="../qr-ios.png" alt="iOS QR Code">
                    </div>
                </div> -->
			</div>

		</div>
		<footer>
			<div data-i18n="website.copyright" class="copyright">© 2026 Nectan. All rights reserved
			</div>
			<div class="footer_links">
				<a data-i18n="website.help" href="/help"> Help </a>
				<a data-i18n="website.privacy_policy.title" href="/privacy"> Privacy Policy </a>
				<a data-i18n="website.tos" href="/tos"> Terms Of Service </a>
				<a href="/tos"> GitHub </a>
				<a href="/tos"> Discord </a>
			</div>
		</footer>
	</div>
</body>

</html>
