<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" type="image/x-icon" href="../icon.ico">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nectan</title>
	<meta name="description"
		content="This Privacy Policy explains how we collect, use, store, protect, and share your personal information through our services.">

	<link rel="stylesheet" href="../index.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
		rel="stylesheet">

	<style>
		.tos_container {
			max-width: 900px;
			margin: 0 auto;
			padding: 64px;
			min-height: auto;
			box-sizing: border-box;
		}

		.tos_container h1 {
			margin-bottom: 48px;
		}

		.tos_container p {
			margin-bottom: 12px;
			line-height: 1.6;
		}


		@media (max-width: 600px) {
			.tos_container {
				padding: 24px 16px;
			}

			.tos_container h1 {
				font-size: 32px;
				text-align: center;
				margin-bottom: 96px;
			}

			.tos_container h2 {
				font-size: 20px;
			}
		}
	</style>
	<script src="../i18n.js" defer></script>
</head>

<body>
	<div class="main_container">
		<div class="header">
			<a href="/" style="text-decoration: none; color: inherit; height: 100%;">
				<div class="logo" style="font-size: 24px; font-weight: 600; font-family: 'Rubik';">
					Nectan</div>
			</a>
			<div class="tabs">
				<a data-i18n="website.pricing" class="tab clicky" style="text-decoration: none;"
					href="/pricing">Pricing</a>
				<a data-i18n="website.download_generic" class="tab clicky"
					style="text-decoration: none;" href="/download">Download Nectan</a>
				<a data-i18n="website.github" class="tab clicky" style="text-decoration: none;"
					href="https://github.com/karoltrykacz/Nectan">GitHub</a>

				<button id="theme-toggle" aria-label="Toggle theme">
					<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="5"></circle>
						<line x1="12" y1="1" x2="12" y2="3"></line>
						<line x1="12" y1="21" x2="12" y2="23"></line>
						<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
						<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
						<line x1="1" y1="12" x2="3" y2="12"></line>
						<line x1="21" y1="12" x2="23" y2="12"></line>
						<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
						<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
					</svg>
					<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
					</svg>
				</button>
			</div>
			<button class="hamburger">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</div>

		<div class="tos_container">
			<h1 data-i18n="website.privacy.title">Privacy Policy</h1>

			<p data-i18n="website.privacy.policy">We don't store or collect your data.</p>

			<p data-i18n="website.privacy.concerns">If you have any questions or concerns about this Privacy
				Policy, contact us at
				support@nectan.app</p>
		</div>

		<footer>
			<div data-i18n="website.copyright" class="copyright">© 2026 Nectan. All rights reserved
			</div>
			<div class="footer_links">
				<a data-i18n="website.help" href="/help"> Help </a>
				<a data-i18n="website.privacy_policy.title" href="/privacy"> Privacy Policy </a>
				<a data-i18n="website.tos" href="/tos"> Terms Of Service </a>
				<a href="/tos"> GitHub </a>
				<a href="/tos"> Discord </a>
			</div>
		</footer>
	</div>

</body>

</html>
