name: nectan_mobile
description: "Nectan. Move Your Files."
publish_to: 'none'
version: 1.0.4+26

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  rust_lib_nectan_mobile:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  google_fonts: ^8.1.0
  qr_flutter: ^4.1.0
  dio: ^5.0.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.3.2
  uuid: ^4.0.0
  in_app_purchase: ^3.2.0
  file_picker: ^8.3.7
  permission_handler: ^12.0.3
  photo_manager: ^3.0.0
  device_info_plus: ^12.4.0
  file_selector_android: ^0.5.2+6
  collection: ^1.19.1
  marquee: ^2.3.0
  flutter_foreground_task: ^9.2.2
  shared_preferences: ^2.5.5
  media_scanner: ^2.2.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.0
  riverpod_annotation: ^4.0.3
  connectivity_plus: ^7.2.0
  wifi_iot: ^0.3.19+2
  video_player: ^2.12.0
  flutter_local_notifications: ^22.0.1
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/mobile_icon.png"
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/mobile_icon.png"

flutter_native_splash:
  color: "#1a1a1a"
  image: assets/mobile_icon.png
  android_12:
    color: "#1a1a1a"
    image: assets/mobile_icon.png
    icon_background_color: "#1a1a1a"


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik/Rubik-Black.ttf
          weight: 900
