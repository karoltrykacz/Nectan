[workspace]
members = ["core", "desktop/explorer", "mobile/rust", "desktop/sender"]
resolver = "3"

[workspace.package]
authors = ["Karol Trykacz"]
repository = "https://github.com/karoltrykacz/Nectan"

[profile.release]
opt-level = 3 
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 256 

[profile.release-debug]
inherits = "release"
lto = false
debug = true
strip = false

[profile.release-small]
inherits = "release"
opt-level = "z"
codegen-units = 256
panic = "abort"
strip = true
debug = false

