[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
authors = ["Karol Trykacz"]
repository = "https://github.com/karoltrykacz/Nectan"

[profile.release]
opt-level = 3 
lto = true 
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units =256 

[profile.release-debug]
inherits = "release"
debug = true
strip = false
