[package]
name = "sender"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[dependencies]
nectan_core = {path = "../../core"}
anyhow = "1.0.104"
ignore = { version = "0.4.33", features = ["simd-accel"] }
open = "5.4.4"
url = "2.5.8"
zbus = "6.1.0"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
dirs = "7.0.0"
rfd = "0.17.2"
slint = {
    git = "https://github.com/R-Cramer4/slint.git",
    branch = "corner-shape",
    default-features = false,
    features = [
        "std",
        "compat-1-18",
        "backend-winit-wayland",
        "backend-winit-x11",
        "renderer-skia",
        "unstable-winit-030",
        "raw-window-handle-06",
    ],
}
uuid = { version = "1.29.0", features = ["v4"] }
notify-rust = { version = "4.18.2", features = ["z-with-tokio"] }
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = {
    git = "https://github.com/R-Cramer4/slint.git",
    branch = "corner-shape",
}
