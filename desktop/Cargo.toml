[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[dependencies]
nectan_core = {path = "../core"}
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }
dirs = "7.0.0"
rfd = "0.17.2"
slint = { version = "1.18.1", features = ["gettext", "renderer-skia", "unstable-winit-030"] }
ignore = { version = "0.4.33", features = ["simd-accel"] }
arboard = "3.6.1"
open = "5.4.4"
nucleo = "0.5.0"
image = "0.25.10"
resvg = "0.48.1"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
url = "2.5.8"

[build-dependencies]
slint-build = "1.18.1"
