[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
authors.workspace = true
repository.workspace = true

[dependencies]
nectan_core = {path = "../core"}
anyhow = "1.0.104"
slint = { version = "1.17.1", features = ["renderer-skia","unstable-winit-030"] }
tokio = { version = "1.53.1", features = ["macros"] }
